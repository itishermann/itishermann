# yaml-language-server: $schema=../schema/cv.schema.json
#
# Source unique du portfolio (itishermann.me) et des CV PDF (FR + EN).
# Toute modification de ce fichier sur `master` reconstruit le site et les PDF.
# Les agents IA doivent lire AGENTS.md avant de dériver un CV ciblé.
#
# Conventions
# - Tout texte affiché est un objet { fr, en }.
# - Les clients finaux ne sont jamais nommés : on les décrit (secteur, taille).
# - `tags` sert au filtrage par cible (devops, mobile, web, backend, ia, lead...).
# - `cv: false` masque un élément du CV PDF généré par défaut (il reste sur le site).
# - Dates au format YYYY-MM. `end` absent = poste en cours.

meta:
  version: 1
  updated: "2026-10-15"
  site: https://itishermann.me

basics:
  name: Hermann Kao
  label:
    fr: Développeur polyvalent, du produit à l'infrastructure
    en: Versatile developer, from product to infrastructure
  greeting:
    fr: Salut, moi c'est Hermann.
    en: Hi, I'm Hermann.
  website: https://itishermann.me
  photo: /photo.png
  location:
    city: Saint-Étienne
    region: Auvergne-Rhône-Alpes
    countryCode: FR
  availability:
    fr: En mission. Ouvert aux échanges pour la suite.
    en: Currently on assignment. Open to talk about what's next.
  remote:
    fr: Hybride à Saint-Étienne ou full remote
    en: Hybrid in Saint-Étienne or fully remote
  summary:
    fr: >-
      Ce qui me caractérise le plus, c'est l'adaptation : je prends le langage,
      le framework et la couche dont le produit a besoin. Au quotidien en
      TypeScript, sur le web comme le mobile, mais aussi à l'aise en Java, C#,
      Rust, Swift ou Python selon le contexte. Je vais du produit à
      l'infrastructure (CI/CD, Kubernetes, cloud, supervision) et j'ai souvent
      été le seul technique d'un produit. Depuis 2025, j'intègre des agents IA
      dans les chaînes de livraison, du ticket jusqu'à la pull request testée.
    en: >-
      What defines me most is adaptability: I pick up whichever language,
      framework and layer a product needs. Day to day in TypeScript, on web and
      mobile, but equally at ease in Java, C#, Rust, Swift or Python depending on
      the context. I work from the product down to the infrastructure (CI/CD,
      Kubernetes, cloud, monitoring) and have often been a product's only
      engineer. Since 2025 I have been wiring AI agents into delivery pipelines,
      from the ticket to a tested pull request.
  profiles:
    - network: GitHub
      username: itishermann
      url: https://github.com/itishermann
    - network: LinkedIn
      username: itishermann
      url: https://www.linkedin.com/in/itishermann
    - network: Blog
      username: itishermann
      url: https://itishermann.hashnode.dev

