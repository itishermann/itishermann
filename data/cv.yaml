# yaml-language-server: $schema=../schema/cv.schema.json
#
# Source unique du portfolio (itishermann.me) et des CV PDF (FR + EN).
# Toute modification de ce fichier sur `master` reconstruit le site et les PDF.
# Les agents IA doivent lire AGENTS.md avant de dériver un CV ciblé.
#
# Conventions
# - Tout texte affiché est un objet { fr, en }.
# - Les clients finaux ne sont jamais nommés : on les décrit (secteur, taille).
# - `tags` sert au filtrage par cible (devops, mobile, web, backend, ia, lead...).
# - `cv: false` masque un élément du CV PDF généré par défaut (il reste sur le site).
# - Dates au format YYYY-MM. `end` absent = poste en cours.

