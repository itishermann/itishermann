basics:
  name: Hermann Kao
  label:
    fr: Développeur fullstack JavaScript / TypeScript, orienté DevOps
    en: Fullstack JavaScript / TypeScript developer with a DevOps focus
  greeting:
    fr: Salut, moi c'est Hermann.
    en: Hi, I'm Hermann.
  email: itishermann@gmail.com
  website: https://itishermann.me
  photo: /photo.jpg
  location:
    city: Saint-Étienne
    region: Auvergne-Rhône-Alpes
    countryCode: FR
  availability:
    fr: En mission. Ouvert aux échanges pour la suite.
    en: Currently on assignment. Open to talk about what's next.
  remote:
    fr: Hybride à Saint-Étienne ou full remote
    en: Hybrid in Saint-Étienne or fully remote
  summary:
    fr: >-
      Je développe des applications web et mobiles en TypeScript depuis 2020, et
      je m'occupe aussi de ce qui tourne en dessous : CI/CD, Kubernetes, AWS,
      supervision. J'ai souvent été le seul technique d'un produit, du backend à
      l'app mobile en passant par l'infra. Depuis 2025, j'intègre des agents IA
      dans les chaînes de livraison, du ticket jusqu'à la pull request testée.
    en: >-
      I have been building web and mobile apps in TypeScript since 2020, and I
      also take care of what runs underneath: CI/CD, Kubernetes, AWS and
      monitoring. I have often been the only engineer on a product, covering the
      backend, the mobile app and the infrastructure. Since 2025 I have been
      wiring AI agents into delivery pipelines, from the ticket to a tested pull
      request.
