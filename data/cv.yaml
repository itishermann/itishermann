  - id: the-after-cancer
    position:
      fr: Développeur mobile, puis fullstack, puis architecte logiciel
      en: Mobile developer, then fullstack developer, then software architect
    organization:
      fr: The After Cancer, application d'accompagnement santé (États-Unis)
      en: The After Cancer, health support app (United States)
    contract:
      fr: Freelance
      en: Freelance
    location:
      fr: Télétravail
      en: Remote
    start: 2025-04
    tags: [mobile, backend, devops, aws, ia, lead]
    summary:
      fr: >-
        Recruté pour l'application mobile, j'ai repris ensuite le backend et
        l'infrastructure. Je suis aujourd'hui le seul technique du produit :
        mobile, backend, backoffice, landing, infra et données. L'application a
        passé les 300 utilisateurs actifs quotidiens.
      en: >-
        Hired for the mobile app, I later took over the backend and the
        infrastructure. I am now the product's only engineer: mobile, backend,
        back office, landing page, infrastructure and data. The app has grown
        past 300 daily active users.
    highlights:
      - fr: Application React Native (Expo) avec OneSignal, CometChat, Google Calendar et l'intégration de Healthie, fournisseur de données de santé.
        en: React Native (Expo) app with OneSignal, CometChat, Google Calendar and an integration with Healthie, a health data provider.
        tags: [mobile, react-native]
      - fr: Architecture AWS (EC2, IAM, logs) et API Gateway devant les prestataires externes (CometChat, Stripe, OneSignal, Healthie).
        en: AWS architecture (EC2, IAM, logging) with an API Gateway in front of external providers (CometChat, Stripe, OneSignal, Healthie).
        tags: [aws, devops, backend, api]
      - fr: Chaîne Notion vers GitHub pilotée par Claude Code. Un agent lit le ticket, pose ses questions dans Notion et ouvre une PR avec ses tests. La fusion reste validée par un humain. Ce dispositif a permis de livrer une fonctionnalité en production en une semaine.
        en: Notion to GitHub pipeline driven by Claude Code. An agent reads the ticket, asks its questions in Notion and opens a pull request with tests. A human still approves every merge. This setup took a feature from ticket to production in one week.
        tags: [ia, cicd, lead]
      - fr: "Évolution de la chaîne de déploiement : scripts Ansible, puis Kamal, puis GitHub Actions vers des instances EC2."
        en: "Deployment pipeline evolution: Ansible scripts, then Kamal, then GitHub Actions to EC2 instances."
        tags: [devops, cicd, aws]
      - fr: Environnement de recette éphémère créé sur AWS pour chaque PR, supprimé au bout de 3 jours.
        en: Ephemeral review environment created on AWS for each pull request, removed after 3 days.
        tags: [aws, devops, cicd]

