name: Site et CV

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Le déploiement est sauté tant que les secrets Cloudflare ne sont pas configurés.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.14'

      - name: Outils PDF (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm ci

      # Valide cv.yaml, génère les PDF FR/EN, construit le site, puis vérifie
      # que tout le texte des PDF est extractible (contrôle ATS).
      - run: npm run build

      # npm run build régénère README.md depuis cv.yaml. Sur master, la CI le committe s'il a changé ;
      # sur une PR, elle signale seulement qu'il faut le régénérer.
      - name: README à jour
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md à jour"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "README : régénéré depuis cv.yaml [skip ci]" -- README.md
            git push
          else
            echo "::warning file=README.md::README.md n'est pas à jour, lancez npm run readme et committez le résultat."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: dist/cv/*.pdf

      # Crée le projet Pages au premier passage ; sans effet s'il existe déjà.
      - name: Projet Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE == 'true' && github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create itishermann --production-branch=master
        continue-on-error: true

      - name: Déployer sur Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=itishermann --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

      - name: Lien de prévisualisation
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != '' }}
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Prévisualisation : $URL" >> "$GITHUB_STEP_SUMMARY"
