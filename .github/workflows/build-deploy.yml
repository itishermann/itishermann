name: Contrôles du site et du CV

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.14'

      - name: Outils PDF (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm ci

      # Valide cv.yaml, génère les PDF FR/EN, construit le site, puis vérifie
      # que tout le texte des PDF est extractible (contrôle ATS).
      - run: npm run build

      # npm run build régénère README.md depuis cv.yaml. Sur master, la CI le committe s'il a changé ;
      # sur une PR, elle signale seulement qu'il faut le régénérer.
      - name: README à jour
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md à jour"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "README : régénéré depuis cv.yaml [skip ci]" -- README.md
            git push
          else
            echo "::warning file=README.md::README.md n'est pas à jour, lancez npm run readme et committez le résultat."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: dist/cv/*.pdf
